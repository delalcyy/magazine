function rsz(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
rsz();window.addEventListener('resize',rsz);

/* ── Easing ── */
const eO=t=>1-Math.pow(1-t,3);
const eIO=t=>t<.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1;
const eI=t=>t*t*t;
const eOQ=t=>1-Math.pow(1-t,5);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const nm=(v,a,b)=>cl((v-a)/(b-a),0,1);
const lp=(a,b,t)=>a+(b-a)*t;

/* ── Page definitions ── */
const PAGES=[
  {label:'MODE',sub:'La Nouvelle Vague',n:'01'},
  {label:'PORTRAIT',sub:'Corps & Lumière',n:'02'},
  {label:'CULTURE',sub:'L\'Art Vivant',n:'03'},
  {label:'STYLE',sub:'Minimalisme Luxe',n:'04'},
  {label:'BEAUTÉ',sub:'Brut & Raffiné',n:'05'},
  {label:'ESPACE',sub:'Vivre Autrement',n:'06'},
  {label:'VOYAGE',sub:'Horizons Ouverts',n:'07'},
  {label:'VISION',sub:'Demain Commence',n:'08'},
];

const TOTAL=680;

/* ── Draw background ── */
function drawBG(){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  const r=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,H*.6);
  r.addColorStop(0,'rgba(30,22,45,.9)');
  r.addColorStop(.6,'rgba(8,5,12,.8)');
  r.addColorStop(1,'rgba(0,0,0,1)');
  g.fillStyle=r;g.fillRect(0,0,W,H);
  g.globalAlpha=.018;
  for(let i=0;i<1200;i++){
    const gx=Math.random()*W,gy=Math.random()*H;
    g.fillStyle=`rgb(${200+Math.random()*55},${200+Math.random()*55},${200+Math.random()*55})`;
    g.fillRect(gx,gy,1,1);
  }
  g.globalAlpha=1;
}

/* ── Podium ── */
function drawPodium(alpha){
  const cx=W/2,by=H*.76,pw=W*.6,d=H*.032,fr=H*.18,sl=.1;
  g.save();g.globalAlpha=alpha;
  const spos=[-pw*.32,0,pw*.32];
  spos.forEach(ox=>{
    const lx=cx+ox;
    const b=g.createLinearGradient(lx,0,lx,by);
    b.addColorStop(0,'rgba(255,255,255,0)');
    b.addColorStop(.65,'rgba(255,255,255,.015)');
    b.addColorStop(1,'rgba(255,255,255,.06)');
    g.beginPath();
    g.moveTo(lx-5,0);g.lineTo(lx+5,0);
    g.lineTo(lx+75,by);g.lineTo(lx-75,by);
    g.closePath();g.fillStyle=b;g.fill();
    const p=g.createRadialGradient(lx,by,0,lx,by,70);
    p.addColorStop(0,'rgba(255,255,255,.22)');
    p.addColorStop(.4,'rgba(255,255,255,.06)');
    p.addColorStop(1,'rgba(255,255,255,0)');
    g.beginPath();g.ellipse(lx,by,70,18,0,0,Math.PI*2);
    g.fillStyle=p;g.fill();
  });
  g.beginPath();
  g.moveTo(cx-pw/2,by);g.lineTo(cx+pw/2,by);
  g.lineTo(cx+pw/2+pw*sl,by+d);g.lineTo(cx-pw/2-pw*sl,by+d);
  g.closePath();
  const tg=g.createLinearGradient(cx-pw/2,by,cx+pw/2,by+d);
  tg.addColorStop(0,'#252525');tg.addColorStop(.5,'#2e2e2e');tg.addColorStop(1,'#181818');
  g.fillStyle=tg;g.fill();
  const sm=g.createLinearGradient(cx-pw/2,0,cx+pw/2,0);
  sm.addColorStop(0,'rgba(255,255,255,0)');
  sm.addColorStop(.3,'rgba(255,255,255,.5)');
  sm.addColorStop(.7,'rgba(255,255,255,.5)');
  sm.addColorStop(1,'rgba(255,255,255,0)');
  g.beginPath();g.moveTo(cx-pw/2,by);g.lineTo(cx+pw/2,by);
  g.strokeStyle=sm;g.lineWidth=1.2;g.stroke();
  g.beginPath();
  g.moveTo(cx-pw/2-pw*sl,by+d);g.lineTo(cx+pw/2+pw*sl,by+d);
  g.lineTo(cx+pw/2+pw*sl,by+d+fr);g.lineTo(cx-pw/2-pw*sl,by+d+fr);
  g.closePath();
  const fg=g.createLinearGradient(0,by+d,0,by+d+fr);
  fg.addColorStop(0,'#1a1a1a');fg.addColorStop(1,'#0a0a0a');
  g.fillStyle=fg;g.fill();
  g.strokeStyle='rgba(255,255,255,.05)';g.lineWidth=.5;g.stroke();
  for(let i=1;i<4;i++){
    const ly=by+d+fr*(i/4);
    const el=g.createLinearGradient(cx-pw/2-pw*sl,0,cx+pw/2+pw*sl,0);
    el.addColorStop(0,'rgba(255,255,255,0)');
    el.addColorStop(.2,'rgba(255,255,255,.04)');
    el.addColorStop(.8,'rgba(255,255,255,.04)');
    el.addColorStop(1,'rgba(255,255,255,0)');
    g.beginPath();g.moveTo(cx-pw/2-pw*sl+10,ly);g.lineTo(cx+pw/2+pw*sl-10,ly);
    g.strokeStyle=el;g.lineWidth=.4;g.stroke();
  }
  const rg=g.createLinearGradient(0,by+d+fr,0,by+d+fr+80);
  rg.addColorStop(0,'rgba(255,255,255,.05)');rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;
  g.fillRect(cx-pw/2-pw*sl-20,by+d+fr,pw+pw*sl*2+40,80);
  g.restore();
}

/* ── Single page ── */
function drawPage(px,py,pw,ph,ang,scY,alpha,spec,idx){
  g.save();
  g.globalAlpha=cl(alpha,0,1);
  g.translate(px,py);
  g.transform(1,0,0,scY,0,0);
  g.rotate(ang);
  const hw=pw/2,hh=ph/2;
  g.shadowColor='rgba(0,0,0,.9)';g.shadowBlur=35;g.shadowOffsetY=18;
  const pgc=idx%2===0?'#f2ede6':'#ede8e0';
  g.fillStyle=pgc;
  g.beginPath();g.roundRect(-hw,-hh,pw,ph,3);g.fill();
  g.shadowColor='transparent';
  g.fillStyle='#0a0a0a';
  g.fillRect(-hw,-hh,pw,ph*.14);
  g.fillStyle='#fff';
  g.font=`300 ${Math.max(9,pw*.08)}px 'Cormorant Garamond',serif`;
  g.textAlign='center';
  g.fillText(spec.label,0,-hh+ph*.096);
  g.fillStyle='rgba(255,255,255,.4)';
  g.font=`300 ${Math.max(7,pw*.055)}px 'Cormorant Garamond',serif`;
  g.textAlign='right';
  g.fillText(spec.n,hw-pw*.07,-hh+ph*.09);
  g.fillStyle='rgba(0,0,0,.1)';
  g.fillRect(-hw+pw*.08,-hh+ph*.14,pw*.84,.5);
  const imgH=ph*.46;
  const imgY=-hh+ph*.15;
  const iw=pw*.86, ih=imgH;
  const ix=-hw+pw*.07;
  g.save();
  g.beginPath();g.rect(ix,imgY,iw,ih);g.clip();
  const pi=PIMGS[idx];
  if(pi&&pi.complete&&pi.naturalWidth>0){
    const ar=pi.naturalWidth/pi.naturalHeight;
    const areaAr=iw/ih;
    let dw,dh,dx,dy;
    if(ar>areaAr){dh=ih;dw=ih*ar;dx=ix-(dw-iw)/2;dy=imgY;}
    else{dw=iw;dh=iw/ar;dx=ix;dy=imgY-(dh-ih)/2;}
    g.drawImage(pi,dx,dy,dw,dh);
    g.fillStyle='rgba(0,0,0,.38)';g.fillRect(ix,imgY,iw,ih);
  } else {
    g.fillStyle='#111';g.fillRect(ix,imgY,iw,ih);
    g.strokeStyle='rgba(255,255,255,.025)';g.lineWidth=.5;
    for(let i=-20;i<30;i++){
      g.beginPath();
      g.moveTo(ix+i*pw*.07,imgY);
      g.lineTo(ix+(i+20)*pw*.07,imgY+ih);
      g.stroke();
    }
  }
  g.restore();
  const ig=g.createRadialGradient(0,imgY+imgH/2,0,0,imgY+imgH/2,pw*.4);
  ig.addColorStop(0,`rgba(255,255,255,.04)`);
  ig.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=ig;g.fillRect(-hw+pw*.07,imgY,pw*.86,imgH);
  const ty=imgY+imgH+ph*.03;
  g.fillStyle='rgba(0,0,0,.65)';
  g.font=`italic 300 ${Math.max(6,pw*.058)}px 'Cormorant Garamond',serif`;
  g.textAlign='left';
  g.fillText(spec.sub,-hw+pw*.08,ty+ph*.04);
  g.fillStyle='rgba(0,0,0,.2)';
  const lineWidths=[.85,.72,.9,.6,.78];
  lineWidths.forEach((lw,i)=>{
    g.fillRect(-hw+pw*.08,ty+ph*.08+i*ph*.045,lw*(pw*.84),1);
  });
  g.fillStyle='rgba(0,0,0,.22)';
  g.font=`300 ${Math.max(6,pw*.05)}px 'Cormorant Garamond',serif`;
  g.textAlign='center';
  g.fillText(`— ${parseInt(spec.n)*8} —`,0,hh-ph*.04);
  g.restore();
}

/* ── Cover ── */
function drawCover(cx,cy,cw,ch,alpha,emerge){
  g.save();g.globalAlpha=cl(alpha,0,1);

  /* gölge */
  g.shadowColor='rgba(0,0,0,.95)';g.shadowBlur=80;g.shadowOffsetY=30;
  g.fillStyle='#050505';
  g.beginPath();g.roundRect(cx-cw/2,cy-ch/2,cw,ch,2);g.fill();
  g.shadowColor='transparent';

  /* fashion1 görseli kartın tamamını kaplar */
  g.save();
  g.beginPath();g.roundRect(cx-cw/2,cy-ch/2,cw,ch,2);g.clip();
  if(COVER_IMG.complete&&COVER_IMG.naturalWidth>0){
    const ar=COVER_IMG.naturalWidth/COVER_IMG.naturalHeight;
    const areaAr=cw/ch;
    let dw,dh,dx,dy;
    if(ar>areaAr){dh=ch;dw=ch*ar;dx=cx-dw/2;dy=cy-ch/2;}
    else{dw=cw;dh=cw/ar;dx=cx-cw/2;dy=cy-dh/2;}
    g.drawImage(COVER_IMG,dx,dy,dw,dh);
  } else {
    g.fillStyle='#111';g.fillRect(cx-cw/2,cy-ch/2,cw,ch);
  }
  g.restore();

  /* ince beyaz çerçeve */
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=.8;
  g.beginPath();g.roundRect(cx-cw/2,cy-ch/2,cw,ch,2);g.stroke();

  g.restore();
}

/* ── Page transform calculator ── */
function getXf(idx,frame){
  const PW=Math.min(W*.155,160),PH=PW*1.46;
  const bx=W/2,by=H*.56;
  const side=idx%2===0?-1:1;
  const col=Math.floor(idx/2);
  const startX=side<0?-PW*.8:W+PW*.8;
  const restX=bx+side*(W*.15+col*PW*1.06);
  const restY=by-col*16;
  const restA=side*.038;
  const flyS=idx*22+25, flyE=flyS+88;
  const mergeS=320+col*12, mergeE=mergeS+60;
  const fadeS=430,fadeE=490;
  let tx,ty,tA,ta,tsY;
  if(frame<flyS)return null;
  else if(frame<flyE){
    const p=eO(nm(frame,flyS,flyE));
    tx=lp(startX,restX,p);ty=lp(by,restY,p);tA=restA*p;ta=p;tsY=1;
  }else if(frame<mergeS){
    tx=restX;ty=restY;tA=restA;ta=1;tsY=1;
  }else if(frame<mergeE){
    const p=eIO(nm(frame,mergeS,mergeE));
    tx=lp(restX,bx,p);ty=lp(restY,by,p);
    tA=restA*(1-p);ta=1;tsY=lp(1,.93,p);
  }else if(frame<fadeS){
    tx=bx;ty=by;tA=0;ta=1;tsY=.93;
  }else{
    const p=eI(nm(frame,fadeS,fadeE));
    tx=bx;ty=by;tA=0;tsY=.93;ta=1-p;
  }
  return{x:tx,y:ty,w:PW,h:PH,ang:tA,al:ta,scy:tsY};
}

/* ── Main render ── */
function render(){
  g.clearRect(0,0,W,H);
  drawBG();
  const podA=eOQ(cl(nm(f,0,35),0,1));
  drawPodium(podA);
  const order=[6,7,4,5,2,3,0,1];
  order.forEach(idx=>{
    const xf=getXf(idx,f);
    if(!xf)return;
    drawPage(xf.x,xf.y,xf.w,xf.h,xf.ang,xf.scy,xf.al,PAGES[idx],idx);
  });
  if(f>=398&&f<420){
    const p=nm(f,398,420);
    const fa=Math.sin(p*Math.PI)*.08;
    g.fillStyle=`rgba(255,255,255,${fa})`;
    g.fillRect(0,0,W,H);
  }
  if(f>=385&&f<440){
    const p=nm(f,385,440);
    for(let i=0;i<28;i++){
      const a=(i/28)*Math.PI*2+f*.06;
      const r=p*W*.32;
      const px=W/2+Math.cos(a)*r;
      const py=H*.56+Math.sin(a)*r*.3;
      g.beginPath();g.arc(px,py,1.5*(1-p),0,Math.PI*2);
      g.fillStyle=`rgba(255,255,255,${(1-p)*.5})`;g.fill();
    }
  }

  /* ── KAPAK: aşağıdan yükseliyor ── */
  if(f>=445){
    const p=eOQ(nm(f,445,575));
    const gp=cl(nm(f,445,575),0,1);
    const cw=Math.min(W*.34,320),ch=cw*1.48;
    const finalY=H*.46;
    const startY=H+ch*.6;
    const cy=lp(startY,finalY,p);
    const sc=.25+.75*p;
    drawCover(W/2,cy,cw*sc,ch*sc,p,gp);
  }


  f++;
  if(f>=TOTAL){rb.style.display='block';return;}
  raf=requestAnimationFrame(render);
}

rb.addEventListener('click',()=>{
  rb.style.display='none';f=0;render();
});

render();
document.addEventListener("click", () => {
  window.location.href = "anasayfa";
});
setTimeout(() => {
  window.location.href = "anasayfa";
}, 12000);
