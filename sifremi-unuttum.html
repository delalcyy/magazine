<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifremi Unuttum — Fashiontv Magazine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,300;1,9..144,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <style>
    #site-header { background: #0a0a0a !important; border-bottom: 1px solid rgba(255,255,255,0.1) !important; }
    #site-header .logo-img { filter: brightness(0) invert(1) !important; }
    #site-header .main-nav > a, #site-header .nav-dropdown-trigger { color: rgba(255,255,255,0.75) !important; }
    #site-header .main-nav > a:hover { color: #fff !important; }
    #site-header .burger span { background: #fff !important; }
  </style>
</head>
<body class="auth-page">

<header class="site-header" id="site-header">
  <div class="header-wrap">
    <a class="logo" href="anasayfa">
      <img src="images/logo.png" class="logo-img" alt="FashionTV" />
    </a>
    <nav class="main-nav" aria-label="Ana menü">
      <a href="anasayfa" data-i18n="nav.home">Ana Sayfa</a>
      <a href="haberler" data-i18n="nav.news">Haberler</a>
      <a href="abonelik" data-i18n="nav.sub">Abonelik</a>
      <a href="casting/index" class="nav-casting">Casting <span class="nav-casting-badge">NEW</span></a>
    </nav>
    <div class="header-right">
      <div class="lang-switcher">
        <button class="lang-current">
          <span class="lang-flag lang-flag-current">🇹🇷</span>
          <span class="lang-code-current">TR</span>
          <svg class="lang-chevron" viewBox="0 0 10 6" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="currentColor"/></svg>
        </button>
        <div class="lang-dropdown">
          <button class="lang-opt active" data-lang="tr"><span class="lang-flag">🇹🇷</span><span class="lang-name">Türkçe</span><span class="lang-check">✓</span></button>
          <button class="lang-opt" data-lang="en"><span class="lang-flag">🇬🇧</span><span class="lang-name">English</span><span class="lang-check">✓</span></button>
          <button class="lang-opt" data-lang="ru"><span class="lang-flag">🇷🇺</span><span class="lang-name">Русский</span><span class="lang-check">✓</span></button>
        </div>
      </div>
      <button class="burger" id="burger" aria-label="Menü"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu">
  <button class="mobile-menu-close" id="mobile-menu-close">✕</button>
  <nav>
    <a href="anasayfa" data-i18n="nav.home">Ana Sayfa</a>
    <a href="haberler" data-i18n="nav.news">Haberler</a>
    <a href="abonelik" data-i18n="nav.sub">Abonelik</a>
    <a href="giris" class="mobile-cta">Giriş Yap</a>
  </nav>
</div>

<div class="auth-layout auth-layout--single">
  <div class="auth-form-col" style="max-width:480px;margin:0 auto;padding-top:120px;padding-bottom:80px;">

    <div class="auth-form-head">
      <span class="auth-form-head__label">Şifre Sıfırlama</span>
      <h1 class="auth-form-head__title">Şifremi Unuttum</h1>
      <p class="auth-form-head__sub">
        E-posta adresinizi girin, size şifre sıfırlama linki gönderelim.
      </p>
    </div>

    <div id="forgot-alert" class="auth-alert"></div>

    <form id="forgot-form" novalidate>
      <div class="form-field">
        <label class="form-field__label" for="email">E-posta Adresi</label>
        <input class="form-field__input" type="email" id="email" name="email"
          placeholder="ornek@email.com" autocomplete="email" required />
      </div>

      <button class="auth-btn auth-btn--gold" type="submit" id="forgot-btn">
        Sıfırlama Linki Gönder
      </button>
    </form>

    <div style="margin-top:24px;text-align:center;">
      <a href="giris" style="font-size:13px;color:rgba(255,255,255,.4);text-decoration:none;">
        ← Giriş sayfasına dön
      </a>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script>
(function () {
  /* Header */
  const burger = document.getElementById('burger');
  const mob    = document.getElementById('mobile-menu');
  const close  = document.getElementById('mobile-menu-close');
  burger?.addEventListener('click', () => mob.classList.add('is-open'));
  close?.addEventListener('click',  () => mob.classList.remove('is-open'));

  /* Form */
  document.getElementById('forgot-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn   = document.getElementById('forgot-btn');
    const alert = document.getElementById('forgot-alert');

    if (!email) {
      showAlert(alert, 'E-posta adresinizi giriniz.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Gönderiliyor…';

    try {
      const res  = await fetch('http://localhost:4000/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      showAlert(alert, data.message, 'success');
      this.style.display = 'none';
    } catch {
      showAlert(alert, 'Bir hata oluştu. Lütfen tekrar deneyin.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sıfırlama Linki Gönder';
    }
  });

  function showAlert(el, msg, type) {
    el.textContent = msg;
    el.className = 'auth-alert auth-alert--' + type;
    el.style.display = 'block';
  }
})();
</script>
<script src="site-lang.js"></script>
</body>
</html>
