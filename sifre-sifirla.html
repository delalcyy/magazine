<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifre Sıfırla — Fashiontv Magazine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,300;1,9..144,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <style>
    #site-header { background: #0a0a0a !important; border-bottom: 1px solid rgba(255,255,255,0.1) !important; }
    #site-header .logo-img { filter: brightness(0) invert(1) !important; }
    #site-header .main-nav > a { color: rgba(255,255,255,0.75) !important; }
    #site-header .main-nav > a:hover { color: #fff !important; }
    #site-header .burger span { background: #fff !important; }
  </style>
</head>
<body class="auth-page">

<header class="site-header" id="site-header">
  <div class="header-wrap">
    <a class="logo" href="anasayfa">
      <img src="images/logo.png" class="logo-img" alt="FashionTV" />
    </a>
    <nav class="main-nav" aria-label="Ana menü">
      <a href="anasayfa">Ana Sayfa</a>
      <a href="haberler">Haberler</a>
      <a href="abonelik">Abonelik</a>
      <a href="casting/index" class="nav-casting">Casting <span class="nav-casting-badge">NEW</span></a>
    </nav>
    <div class="header-right">
      <button class="burger" id="burger" aria-label="Menü"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="mobile-menu" id="mobile-menu">
  <button class="mobile-menu-close" id="mobile-menu-close">✕</button>
  <nav>
    <a href="anasayfa">Ana Sayfa</a>
    <a href="giris" class="mobile-cta">Giriş Yap</a>
  </nav>
</div>

<div class="auth-layout auth-layout--single">
  <div class="auth-form-col" style="max-width:480px;margin:0 auto;padding-top:120px;padding-bottom:80px;">

    <div class="auth-form-head">
      <span class="auth-form-head__label">Yeni Şifre</span>
      <h1 class="auth-form-head__title">Şifre Belirle</h1>
      <p class="auth-form-head__sub">Yeni şifrenizi aşağıya girin.</p>
    </div>

    <div id="reset-alert" class="auth-alert"></div>

    <form id="reset-form" novalidate>
      <div class="form-field">
        <label class="form-field__label" for="password">Yeni Şifre</label>
        <div class="pw-field">
          <input class="form-field__input" type="password" id="password" name="password"
            placeholder="En az 6 karakter" required />
          <button type="button" class="pw-toggle" data-target="password" aria-label="Göster">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-field">
        <label class="form-field__label" for="password_confirm">Şifre Tekrar</label>
        <div class="pw-field">
          <input class="form-field__input" type="password" id="password_confirm" name="password_confirm"
            placeholder="Şifrenizi tekrar girin" required />
          <button type="button" class="pw-toggle" data-target="password_confirm" aria-label="Göster">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="auth-btn auth-btn--gold" type="submit" id="reset-btn">
        Şifremi Güncelle
      </button>
    </form>

    <div id="success-area" style="display:none;text-align:center;padding:20px 0;">
      <p style="color:rgba(255,255,255,.7);margin-bottom:20px;">Şifreniz başarıyla güncellendi.</p>
      <a href="giris" class="auth-btn auth-btn--gold" style="display:inline-block;text-decoration:none;">
        Giriş Yap
      </a>
    </div>

  </div>
</div>

<script>
(function () {
  /* Header burger */
  const burger = document.getElementById('burger');
  const mob    = document.getElementById('mobile-menu');
  const close  = document.getElementById('mobile-menu-close');
  burger?.addEventListener('click', () => mob.classList.add('is-open'));
  close?.addEventListener('click',  () => mob.classList.remove('is-open'));

  /* Şifre göster/gizle */
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      input.type  = input.type === 'password' ? 'text' : 'password';
    });
  });

  /* Token URL'den al */
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    showAlert('Geçersiz link. Lütfen tekrar şifre sıfırlama talebi oluşturun.', 'error');
    document.getElementById('reset-form').style.display = 'none';
  }

  /* Form */
  document.getElementById('reset-form')?.addEventListener('submit', async function (e) {
    e.preventDefault();
    const password         = document.getElementById('password').value;
    const password_confirm = document.getElementById('password_confirm').value;
    const btn              = document.getElementById('reset-btn');

    if (password.length < 6) {
      showAlert('Şifre en az 6 karakter olmalıdır.', 'error'); return;
    }
    if (password !== password_confirm) {
      showAlert('Şifreler birbiriyle eşleşmiyor.', 'error'); return;
    }

    btn.disabled    = true;
    btn.textContent = 'Güncelleniyor…';

    try {
      const res  = await fetch('http://localhost:4000/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password, password_confirm })
      });
      const data = await res.json();

      if (data.success) {
        this.style.display = 'none';
        document.getElementById('success-area').style.display = 'block';
      } else {
        showAlert(data.message, 'error');
      }
    } catch {
      showAlert('Bir hata oluştu. Lütfen tekrar deneyin.', 'error');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Şifremi Güncelle';
    }
  });

  function showAlert(msg, type) {
    const el = document.getElementById('reset-alert');
    el.textContent = msg;
    el.className   = 'auth-alert auth-alert--' + type;
    el.style.display = 'block';
  }
})();
</script>
</body>
</html>
